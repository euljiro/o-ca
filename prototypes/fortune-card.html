<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 기운</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #0b0b0d;
    --paper: #ffffff;
    --ink: #111111;
    --ink-2: #6b6b6b;
    --rule: #e4e4e4;
    --rule-2: #cfcfcf;
    --mono: "IBM Plex Mono", "Noto Sans KR", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--page); font-family: "Noto Sans KR", system-ui, sans-serif; color: var(--ink); display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .phone { position: relative; width: 100%; max-width: 430px; height: 100dvh; overflow: hidden; background: var(--page); }
  @media (min-width: 600px) { .phone { height: min(932px, 94dvh); border-radius: 44px; box-shadow: 0 30px 80px rgba(0,0,0,.5); } }

  /* 카드 */
  .card {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 14px); bottom: calc(env(safe-area-inset-bottom) + 14px);
    left: 14px; right: 14px;
    background: var(--paper); border-radius: 6px;
    padding: 12px 14px 14px;
    display: flex; flex-direction: column;
  }
  @media (min-width: 600px) { .card { top: 30px; bottom: 30px; left: 20px; right: 20px; } }

  .topline { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; height: 26px; }
  .nav { display: flex; align-items: center; gap: 2px; }
  .nav button { height: 26px; min-width: 26px; display: grid; place-items: center; border-radius: 4px; }
  .nav button:active { background: #f0f0f0; }
  .nav svg { width: 14px; height: 14px; }
  .nav .me-btn { margin-left: 6px; padding: 0 8px; border: 1px solid var(--ink); font-weight: 600; }

  /* 이미지 영역 */
  .art { position: relative; flex: 1 1 auto; min-height: 220px; margin-top: 6px; border-radius: 14px; overflow: hidden; background: #ddd; }
  .art canvas, .art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #icon { touch-action: none; }
  .orn { pointer-events: none; }
  .orn path, .orn rect, .orn circle, .orn ellipse { fill: none; stroke: #fff; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .orn .fill { fill: #fff; stroke: none; }
  .orn .dim { opacity: .7; }

  .meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; font-weight: 500; margin-top: 7px; color: var(--ink); }

  .content { transition: opacity .3s, transform .3s; }
  .swap .content { opacity: 0; transform: translateY(4px); }
  .title { margin: 12px 0 10px; font-size: 26px; font-weight: 900; line-height: 1.2; letter-spacing: -.045em; word-break: keep-all; }

  /* 스펙 표 */
  .spec { display: grid; grid-template-columns: 1fr 1fr; font-family: var(--mono); font-size: 11px; line-height: 1; }
  .spec .l { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
  .spec .l span:last-child { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
  .spec .r { position: relative; border-left: 1px solid var(--rule-2); }
  .spec .r .track { position: absolute; left: 10px; right: 0; top: 50%; height: 1px; background: var(--rule-2); }
  .spec .r .mk { position: absolute; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; background: var(--ink); transition: left .6s cubic-bezier(.2,.8,.2,1); }
  .spec .full { grid-column: 1 / -1; padding-right: 0; }
  .spec .full span:last-child { white-space: normal; text-align: right; line-height: 1.35; }
  .sw { width: 9px; height: 9px; display: inline-block; flex: none; }
  .warn span:first-child { color: #d9480f; }

  /* 설정 시트 */
  .sheet-bg { position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .sheet { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 22px 22px 0 0; padding: 12px 20px calc(env(safe-area-inset-bottom) + 20px); transform: translateY(105%); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
  .open .sheet-bg { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .grab { width: 36px; height: 4px; border-radius: 4px; background: #ddd; margin: 0 auto 16px; }
  .sheet h2 { font-size: 20px; font-weight: 900; letter-spacing: -.03em; }
  .sheet p { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.5; }
  .sheet input { margin-top: 16px; width: 100%; height: 50px; border-radius: 10px; border: 1px solid #ddd; padding: 0 14px; font: inherit; font-size: 16px; background: #f7f7f7; color: var(--ink); }
  .me { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: #f7f7f7; font-size: 14px; }
  .me b { font-weight: 900; }
  .primary { margin-top: 16px; width: 100%; height: 50px; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 700; font-size: 16px; }
</style>
</head>

  </div>
</div>

/* ───────────── 1. 오행 데이터 ───────────── */

// 0 목 · 1 화 · 2 토 · 3 금 · 4 수

const stemEl = s => Math.floor(s / 2);

// 관계. lucky = 행운 오행 offset (0 비겁 · 1 식상 · 4 인성), score = [총운, 금전, 애정, 일·학업, 건강] 기준값
const REL = [
  { key:'비겁', name:'어깨동무의 날', lucky:1, score:[70,50,66,72,76],
    lines:['오늘은 같은 편을 찾는 날','말 통하는 사람이 답이다','혼자 끙끙대지 말고 공유하기','내 고집, 오늘만 반으로 접기','익숙한 길에서 힘이 난다','어깨 나란히, 속도는 두 배'],
    caution:['자존심 싸움으로 번지는 말','돈 거래·보증은 오늘 말고','내 방식만 맞다는 생각'] },

    caution:['필터 없이 나가는 한마디','에너지 과소비, 오늘은 일찍 자기','윗사람 앞에서의 지적'] },
  { key:'재성', name:'수확의 날', lucky:0, score:[78,88,68,70,62],
    lines:['미뤄둔 걸 거둬들이는 날','작은 성과라도 확실히 챙기기','계산이 맞아떨어진다','오늘의 선택은 실속 쪽으로','정리하면 돈 흐름이 보인다','원하는 걸 정확히 말하면 온다'],
    caution:['충동구매 장바구니','욕심내서 일 벌리기','결과만 보고 사람 놓치기'] },
  { key:'관성', name:'단련의 날', lucky:4, score:[62,58,60,80,55],
    lines:['오늘의 압박은 레벨업 신호','약속을 지키면 신뢰가 쌓인다','규칙 안에서 더 빛나는 날','버티는 것도 실력이다','피드백은 선물로 받기','한 박자 쉬고 대답하기'],
    caution:['마감 직전 몰아치기','감정 섞인 답장','무리한 약속'] },

    lines:['도움은 받을수록 좋은 날','배우는 만큼 가벼워진다','오늘은 충전 모드 ON','좋은 문장 하나가 하루를 바꾼다','어른의 조언에 힌트가 있다','쉬어 가도 늦지 않다'],
    caution:['생각만 하고 미루기','남에게 기대기만 하기','늦잠과 과식'] },
];
const SCORE_LABELS = ['총운', '금전', '애정', '일·학업', '건강'];

/* ───────────── 2. 계산 ───────────── */
// 2000-01-01 = 무오(戊午)일, 60갑자 인덱스 54
function dayPillar(y, m, d) {
  const days = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(2000, 0, 1)) / 86400000);
  const idx = ((days + 54) % 60 + 60) % 60;
  return { idx, stem: idx % 10, branch: idx % 12 };
}
const relationOf = (me, day) => ((day - me) % 5 + 5) % 5; // 0 비겁 1 식상 2 재성 3 관성 4 인성
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ───────────── 3. 오행별 라인 장식 (SVG) ───────────── */
const f1 = n => n.toFixed(1);
const star4 = (x, y, s) => `<path class="fill" d="M${f1(x)} ${f1(y - s)}Q${f1(x)} ${f1(y)} ${f1(x + s)} ${f1(y)}Q${f1(x)} ${f1(y)} ${f1(x)} ${f1(y + s)}Q${f1(x)} ${f1(y)} ${f1(x - s)} ${f1(y)}Q${f1(x)} ${f1(y)} ${f1(x)} ${f1(y - s)}Z"/>`;

function ornament(el, W, H) {
  const i = 14, cx = W / 2, cy = H / 2;
  let back = '', front = '';   // back: 아이콘 뒤 / front: 테두리
  if (el === 0) { // 목: 아치 창 + 새싹
    const r = W / 2 - i, ay = i + r, o = 8, r2 = r - o;
    front += `<path d="M${i} ${H - i}L${i} ${ay}A${r} ${r} 0 0 1 ${W - i} ${ay}L${W - i} ${H - i}Z"/>`;
    front += `<path d="M${i + o} ${H - i - o}L${i + o} ${ay}A${r2} ${r2} 0 0 1 ${W - i - o} ${ay}L${W - i - o} ${H - i - o}Z"/>`;
    const b = H - i - o;
    front += `<path d="M${cx} ${b}L${cx} ${b - 40}"/>`;
    front += `<path d="M${cx} ${b - 14}q12 -2 18 -18q-14 0 -18 12M${cx} ${b - 24}q-12 -2 -18 -18q14 0 18 12M${cx} ${b - 40}q6 -6 0 -14q-6 8 0 14"/>`;
    for (let k = 0; k < 6; k++) {
      const x1 = i + o + 10 + k * 7, x2 = W - i - o - 10 - k * 7, hgt = 6 + (k % 3) * 5;
      front += `<path d="M${x1} ${b}l${k % 2 ? 2 : -2} ${-hgt}M${x2} ${b}l${k % 2 ? -2 : 2} ${-hgt}"/>`;
    }
    front += star4(cx, i + o + 16, 5);
    back += `<path class="dim" d="M${cx - r2 * 0.6} ${ay + 10}A${r2 * 0.6} ${r2 * 0.6} 0 0 1 ${cx + r2 * 0.6} ${ay + 10}"/>`;
  } else if (el === 1) { // 화: 오목한 모서리 + 햇살 + 알약 창
    const c = 16;
    front += `<path d="M${i + c} ${i}L${W - i - c} ${i}A${c} ${c} 0 0 0 ${W - i} ${i + c}L${W - i} ${H - i - c}A${c} ${c} 0 0 0 ${W - i - c} ${H - i}L${i + c} ${H - i}A${c} ${c} 0 0 0 ${i} ${H - i - c}L${i} ${i + c}A${c} ${c} 0 0 0 ${i + c} ${i}Z"/>`;
    let rays = '';
    for (let k = 0; k <= 18; k++) {
      const a = Math.PI * (0.1 + 0.8 * k / 18), r1 = 6, r2 = k % 2 ? 26 : 40;
      const dx = Math.cos(a), dy = Math.sin(a);
      rays += `M${f1(cx + dx * r1)} ${f1(i + dy * r1)}L${f1(cx + dx * r2)} ${f1(i + dy * r2)}`;
      rays += `M${f1(cx + dx * r1)} ${f1(H - i - dy * r1)}L${f1(cx + dx * r2)} ${f1(H - i - dy * r2)}`;
    }
    front += `<path d="${rays}"/>`;
    const w = W - 2 * i - 44, h = H - 2 * i - 110;
    back += `<rect class="dim" x="${i + 22}" y="${i + 55}" width="${w}" height="${h}" rx="${Math.min(w, h) / 2}"/>`;
  } else if (el === 2) { // 토: 이중 사각 + 마름모 + 모서리 표식
    front += `<rect x="${i}" y="${i}" width="${W - 2 * i}" height="${H - 2 * i}"/>`;
    const j = i + 9, L = 14;
    front += `<path d="M${j} ${j + L}V${j}H${j + L}M${W - j - L} ${j}H${W - j}V${j + L}M${W - j} ${H - j - L}V${H - j}H${W - j - L}M${j + L} ${H - j}H${j}V${H - j - L}"/>`;
    const d = Math.min(W, H) / 2 - i - 6;
    back += `<path class="dim" d="M${cx} ${cy - d}L${cx + d} ${cy}L${cx} ${cy + d}L${cx - d} ${cy}Z"/>`;
    back += `<path class="dim" d="M${i} ${cy}H${cx - d}M${cx + d} ${cy}H${W - i}"/>`;
    [[cx, cy - d], [cx + d, cy], [cx, cy + d], [cx - d, cy]].forEach(([x, y]) => { front += `<circle class="fill" cx="${x}" cy="${y}" r="2.6"/>`; });
  } else if (el === 3) { // 금: 둥근 사각 + 교차 타원 + 반짝임
    front += `<rect x="${i}" y="${i}" width="${W - 2 * i}" height="${H - 2 * i}" rx="22"/>`;
    const rxv = W / 2 - i - 34, ryv = H / 2 - i - 8, rxh = W / 2 - i - 8, ryh = H / 2 - i - 64;
    back += `<ellipse class="dim" cx="${cx}" cy="${cy}" rx="${rxv}" ry="${ryv}"/>`;
    back += `<ellipse class="dim" cx="${cx}" cy="${cy}" rx="${rxh}" ry="${ryh}"/>`;
    front += star4(cx, cy - ryv, 8) + star4(cx, cy + ryv, 8) + star4(cx - rxh, cy, 7) + star4(cx + rxh, cy, 7);
    front += star4(W - i - 22, i + 22, 4) + star4(i + 22, H - i - 22, 4);
  } else { // 수: 물결 테두리 + 동심원
    // 변마다 물결 수를 정수로 맞춰 모서리에서 진폭 0 → 네 변이 끊김 없이 이어짐
    const A = 3.2, lam = 22, pts = [];
    const corners = [[i, i], [W - i, i], [W - i, H - i], [i, H - i]];
    corners.forEach(([ax, ay], e) => {
      const [bx, by] = corners[(e + 1) % 4];
      const len = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.round(len / lam));
      const ux = (bx - ax) / len, uy = (by - ay) / len, nx = uy, ny = -ux; // 바깥쪽 법선
      const steps = Math.ceil(len / 1.5);
      for (let k = (e === 0 ? 0 : 1); k <= steps; k++) {
        const t = (k / steps) * len, w = A * Math.sin(2 * Math.PI * n * t / len);
        pts.push(`${f1(ax + ux * t + nx * w)} ${f1(ay + uy * t + ny * w)}`);
      }
    });
    front += `<path d="M${pts.join('L')}Z"/>`;
    const R = Math.min(W, H) / 2 - i - 14;
    [0.45, 0.62, 0.8, 0.98].forEach((k, n) => { back += `<circle class="dim" cx="${cx}" cy="${cy}" r="${f1(R * k)}" style="opacity:${0.75 - n * 0.15}"/>`; });
  }
  return `${back}${front}`;
}

/* ───────────── 4. 그라데이션 + 3D 아이콘 ───────────── */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const v3 = hex => { const c = parseInt(hex.slice(1), 16); return new THREE.Vector3((c >> 16 & 255) / 255, (c >> 8 & 255) / 255, (c & 255) / 255); };

// 그라데이션 (위: 오늘의 오행 / 아래: 나의 오행)
const gradR = new THREE.WebGLRenderer({ canvas: document.getElementById('grad') });
gradR.setPixelRatio(DPR);
const gradScene = new THREE.Scene();
const gradCam = new THREE.Camera();
const GU = {
  uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) }, uDpr: { value: DPR }, uSeed: { value: 0 },
  uA0: { value: new THREE.Vector3() }, uA1: { value: new THREE.Vector3() }, uA2: { value: new THREE.Vector3() },
  uB0: { value: new THREE.Vector3() }, uB1: { value: new THREE.Vector3() }, uB2: { value: new THREE.Vector3() },
};
const grad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: GU, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform float uTime, uDpr, uSeed; uniform vec2 uRes;
    uniform vec3 uA0, uA1, uA2, uB0, uB1, uB2;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
    float fbm(vec2 p){ float v = 0.0, a = 0.5; mat2 m = mat2(1.6,1.2,-1.2,1.6);
      for (int i = 0; i < 5; i++){ v += a * noise(p); p = m * p; a *= 0.5; } return v; }
    vec3 pal(vec3 c0, vec3 c1, vec3 c2, float f, float k){
      vec3 c = mix(c0, c1, smoothstep(0.25, 0.75, f));
      return mix(c, c2, smoothstep(0.55, 0.95, k));
    }
    void main(){
      vec2 p = vec2(vUv.x * uRes.x / uRes.y, vUv.y);
      float t = uTime * 0.035;
      // 이중 도메인 워핑: 액체처럼 흐르는 물결
      vec2 q = vec2(fbm(p * 1.3 + uSeed + t), fbm(p * 1.3 + vec2(5.2, 1.3) - t));
      vec2 r = vec2(fbm(p * 1.5 + 3.0 * q + vec2(1.7, 9.2) + t * 1.4), fbm(p * 1.5 + 3.0 * q + vec2(8.3, 2.8) - t));
      float f = fbm(p * 1.1 + 2.4 * r);
      float k = fbm(p * 2.0 + 1.8 * q + uSeed * 0.5);
      float m = smoothstep(0.40, 0.60, fbm(p * 0.7 + r * 1.6 + uSeed * 1.7) + (vUv.y - 0.45) * 0.55);
      vec3 col = mix(pal(uA0, uA1, uA2, f, k), pal(uB0, uB1, uB2, f, k), m);
      // 두 기운이 만나는 경계의 빛나는 띠
      float ridge = pow(1.0 - abs(m - 0.5) * 2.0, 5.0);
      col = mix(col, vec3(1.0), ridge * 0.5);
      col *= 1.0 - 0.15 * length(vUv - vec2(0.5, 0.5));
      col += (hash(gl_FragCoord.xy / uDpr + fract(uTime) * 91.7) - 0.5) * 0.11;
      gl_FragColor = vec4(col, 1.0);
    }`,
}));
grad.frustumCulled = false; gradScene.add(grad);

// 3D 아이콘 (투명 배경 · 장식 라인 위에 얹힘)
const iconR = new THREE.WebGLRenderer({ canvas: document.getElementById('icon'), antialias: true, alpha: true });
iconR.setPixelRatio(DPR);
iconR.setClearColor(0x000000, 0);
iconR.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 9);
const pmrem = new THREE.PMREMGenerator(iconR);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.2); rim.position.set(-4, -1, -3); scene.add(rim);

const holoScene = new THREE.Scene();
holoScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 64, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec3 vP; void main(){
    float a = atan(vP.z, vP.x) * 1.5 + vP.y * 3.0;
    vec3 c = 0.62 + 0.38 * cos(6.2831 * (vec3(0.0, 0.33, 0.67) + a * 0.25));
    c = mix(c, vec3(1.0), smoothstep(0.6, 1.0, vP.y) * 0.8);
    c *= mix(0.35, 1.0, smoothstep(-0.8, 0.2, vP.y));
    gl_FragColor = vec4(c, 1.0); }`,
})));
const holoEnv = pmrem.fromScene(holoScene, 0.02).texture;

function normalize(geo) {
  geo.computeBoundingBox(); geo.center();
  const s = new THREE.Vector3(); geo.boundingBox.getSize(s);
  const k = 2 / Math.max(s.x, s.y, s.z); geo.scale(k, k, k);
  geo.computeVertexNormals();
  return geo;
}
const EXTRUDE = { depth: 0.28, bevelEnabled: true, bevelThickness: 0.28, bevelSize: 0.2, bevelSegments: 12, curveSegments: 48 };
function iconGeometry(el) {
  if (el === 0) {
    const s = new THREE.Shape(); s.moveTo(0, -1.1);
    s.bezierCurveTo(0.95, -0.55, 0.85, 0.65, 0, 1.15); s.bezierCurveTo(-0.85, 0.65, -0.95, -0.55, 0, -1.1);
    return normalize(new THREE.ExtrudeGeometry(s, EXTRUDE));
  }
  if (el === 1) {
    const s = new THREE.Shape(); s.moveTo(0, -1.0);
    s.bezierCurveTo(0.78, -1.0, 0.98, -0.35, 0.62, 0.2); s.bezierCurveTo(0.42, 0.5, 0.16, 0.66, 0.22, 1.18);
    s.bezierCurveTo(-0.28, 0.86, -0.88, 0.5, -0.82, -0.15); s.bezierCurveTo(-0.78, -0.72, -0.45, -1.0, 0, -1.0);
    return normalize(new THREE.ExtrudeGeometry(s, EXTRUDE));
  }
  if (el === 2) return normalize(new RoundedBoxGeometry(1.4, 1.4, 1.4, 8, 0.36));
  if (el === 3) {
    const s = new THREE.Shape(); s.moveTo(0, 1.2);
    s.quadraticCurveTo(0.14, 0.14, 1.2, 0); s.quadraticCurveTo(0.14, -0.14, 0, -1.2);
    s.quadraticCurveTo(-0.14, -0.14, -1.2, 0); s.quadraticCurveTo(-0.14, 0.14, 0, 1.2);
    return normalize(new THREE.ExtrudeGeometry(s, { ...EXTRUDE, depth: 0.18, bevelThickness: 0.2, bevelSize: 0.12 }));
  }
  const pts = [], N = 64;
  for (let k = 0; k <= N; k++) {
    const a = (k / N) * Math.PI;
    pts.push(new THREE.Vector2(Math.max(Math.sin(a) * Math.pow(1 - k / N, 0.35), 0.0001), -Math.cos(a) + Math.pow(k / N, 3) * 0.75));
  }
  return normalize(new THREE.LatheGeometry(pts, 72));
}
function iconMaterial(el) {
  switch (el) {
    case 0: return new THREE.MeshPhysicalMaterial({ color: 0x2fd18a, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08, sheen: 0.6, sheenColor: new THREE.Color(0xd4f56b) });
    case 1: return new THREE.MeshPhysicalMaterial({ color: 0xff2e93, emissive: 0xff2a6a, emissiveIntensity: 0.35, roughness: 0.18, clearcoat: 1, iridescence: 0.4, iridescenceIOR: 1.5 });
    case 2: return new THREE.MeshPhysicalMaterial({ color: 0xdc9a4c, roughness: 0.88, sheen: 1, sheenRoughness: 0.6, sheenColor: new THREE.Color(0xffe2b8) });
    case 3: return new THREE.MeshPhysicalMaterial({ envMap: holoEnv, envMapIntensity: 1.2, color: 0xffffff, metalness: 1, roughness: 0.14, iridescence: 1, iridescenceIOR: 1.8, iridescenceThicknessRange: [120, 900], clearcoat: 1 });
    default: return new THREE.MeshPhysicalMaterial({ color: 0x6fa8ff, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6, specularIntensity: 1, sheen: 0.5, sheenColor: new THREE.Color(0xcfe9ff), iridescence: 0.3, iridescenceIOR: 1.33 });
  }
}

let mesh = null, pop = 1, baseScale = 1, curEl = -1;
const cur = { A: [], B: [] }, tgt = { A: [], B: [] };
const art = document.getElementById('artBox');
let W = 1, H = 1;

function resize() {
  W = art.clientWidth; H = art.clientHeight;
  gradR.setSize(W, H, false); iconR.setSize(W, H, false);
  GU.uRes.value.set(W * DPR, H * DPR);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  const visH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  baseScale = Math.min(visH * camera.aspect, visH) * 0.25;
  const svg = document.getElementById('orn');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (curEl >= 0) svg.innerHTML = ornament(curEl, W, H);
}
new ResizeObserver(resize).observe(art);

function setArt(myEl, dayEl, seed, instant) {
  tgt.A = EL[myEl].pal.map(v3); tgt.B = EL[dayEl].pal.map(v3);
  if (instant || !cur.A.length) { cur.A = tgt.A.map(v => v.clone()); cur.B = tgt.B.map(v => v.clone()); }
  GU.uSeed.value = seed;
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
  mesh = new THREE.Mesh(iconGeometry(dayEl), iconMaterial(dayEl));
  mesh.userData.k = dayEl === 2 ? 0.78 : 1;
  scene.add(mesh); pop = 0;
  curEl = dayEl;
  document.getElementById('orn').innerHTML = ornament(dayEl, W, H);
}

// 드래그로 회전
let drag = null, spin = 0, tiltX = 0;
const iconCanvas = document.getElementById('icon');
iconCanvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; iconCanvas.setPointerCapture(e.pointerId); });
iconCanvas.addEventListener('pointermove', e => {
  if (!drag) return;
  spin = (e.clientX - drag.x) * 0.012;
  tiltX = THREE.MathUtils.clamp(tiltX + (e.clientY - drag.y) * 0.006, -0.6, 0.6);
  drag = { x: e.clientX, y: e.clientY };
});
iconCanvas.addEventListener('pointerup', () => { drag = null; });

/* ───────────── 5. 화면 ───────────── */
const $ = id => document.getElementById(id);
const phone = $('phone');
let birth = '1995-03-15', hasBirth = false, offset = 0;
try { const b = localStorage.getItem('fortune.birth'); if (b) { birth = b; hasBirth = true; } } catch (e) {}

function specRow(label, value, score, cls = '') {
  const bar = score == null ? '' : `<div class="track"></div><div class="mk" style="left:calc(10px + (100% - 10px) * ${score / 100})"></div>`;
  return `<div class="l ${cls}"><span>${label}</span><span>${value}</span></div><div class="r">${bar}</div>`;
}

function render(instant) {
  const [by, bm, bd] = birth.split('-').map(Number);
  const me = dayPillar(by, bm, bd), myEl = stemEl(me.stem);
  const now = new Date(); now.setDate(now.getDate() + offset);
  const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  const day = dayPillar(y, m, d), dayEl = stemEl(day.stem);
  const rel = REL[relationOf(myEl, dayEl)];
  const h = hash(`${birth}|${y}-${m}-${d}`);
  const L = EL[(myEl + rel.lucky) % 5].lucky;
  const scores = rel.score.map((s, k) => Math.max(18, Math.min(98, s + ((h >>> (k * 5)) % 21) - 10)));

  $('year').textContent = y;
  $('dDate').textContent = `${String(m).padStart(2, '0')}.${String(d).padStart(2, '0')} ${DOW[now.getDay()]}`;
  $('meBtn').textContent = `나 ${STEMS_HJ[me.stem]}${EL[myEl].hj}`;

  const card = $('card');
  card.classList.add('swap');
  setTimeout(() => {
    $('relTxt').textContent = `${rel.name} / ${rel.key}`;
    $('dayNo').textContent = `No.${String(day.idx + 1).padStart(2, '0')} · ${STEMS_HJ[day.stem]}${BR_HJ[day.branch]}`;
    $('headline').textContent = rel.lines[h % rel.lines.length];
    $('spec').innerHTML =
      SCORE_LABELS.map((lb, k) => specRow(lb, scores[k], scores[k])).join('') +
      `<div class="l full"><span>길한 것</span><span>${L.item}</span></div>` +
      `<div class="l full warn"><span>조심할 것</span><span>${rel.caution[(h >>> 8) % rel.caution.length]}</span></div>`;
    card.classList.remove('swap');
  }, instant ? 0 : 200);

  setArt(myEl, dayEl, (h % 1000) / 100, instant);
}

$('prev').onclick = () => { offset--; render(); };
$('next').onclick = () => { offset++; render(); };
function previewMe() {
  const v = $('birth').value; if (!v) return;
  const [a, b, c] = v.split('-').map(Number); const p = dayPillar(a, b, c); const e = stemEl(p.stem);
  $('meInfo').innerHTML = `나의 일간은 <b>${STEMS_KO[p.stem]}${EL[e].ko}(${STEMS_HJ[p.stem]}${EL[e].hj})</b> · ${STEM_NATURE[p.stem]}`;
}
const openSheet = () => { phone.classList.add('open'); $('birth').value = birth; previewMe(); };
const closeSheet = () => phone.classList.remove('open');
$('openSheet').onclick = openSheet;
$('sheetBg').onclick = closeSheet;
$('birth').addEventListener('input', previewMe);
$('save').onclick = () => {
  const v = $('birth').value; if (!v) return;
  birth = v; try { localStorage.setItem('fortune.birth', v); } catch (e) {}
  closeSheet(); render();
};

resize();
render(true);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const speed = reduce ? 0.25 : 1;
const clock = new THREE.Clock();
const easeBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
(function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime * speed;
  GU.uTime.value = t;
  ['A', 'B'].forEach(k => cur[k].forEach((v, i) => { v.lerp(tgt[k][i], 1 - Math.pow(0.02, dt)); GU[`u${k}${i}`].value.copy(v); }));
  gradR.render(gradScene, gradCam);

  pop = Math.min(1, pop + dt * 1.4);
  if (mesh) {
    spin *= 0.94;
    mesh.rotation.y += 0.45 * dt * speed + spin;
    mesh.rotation.x += (tiltX + Math.sin(t * 0.7) * 0.12 - mesh.rotation.x) * 0.08;
    mesh.position.y = Math.sin(t * 1.1) * 0.06;
    mesh.scale.setScalar(baseScale * mesh.userData.k * easeBack(pop));
  }
  iconR.render(scene, camera);
  requestAnimationFrame(tick);
})();

if (!hasBirth) setTimeout(openSheet, 600);
</script>
</body>
</html>
